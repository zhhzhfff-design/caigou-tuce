<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品采购图册</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;
  --card:#FFFFFF;
  --txt:#F2F2F2;
  --txt2:#8A8A8A;
  --txt3:#5A5A5A;
  --line:#1E1E1E;
  --thumb:300px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:13px;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
img{display:block}

/* ================= 顶栏 ================= */
.top{
  height:74px;padding:0 32px;display:flex;align-items:center;gap:14px;flex:none;
}

.right{margin-left:auto;display:flex;align-items:center;gap:14px}

.vt{display:flex;gap:2px;background:#141414;border-radius:10px;padding:3px}
.vt button{
  width:34px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:#6E6E6E;transition:.14s;
}
.vt button:hover{color:#BDBDBD}
.vt button.on{background:#242424;color:#fff}

.search{position:relative;width:330px}
.search input{
  width:100%;height:46px;border-radius:999px;background:#151515;
  border:1px solid #262626;color:#fff;font-size:14px;
  padding:0 20px 0 50px;outline:none;transition:.18s;
}
.search input::placeholder{color:#6E6E6E}
.search input:focus{border-color:#3A3A3A;background:#181818}
.search .ico{
  position:absolute;left:19px;top:50%;transform:translateY(-50%);
  color:#7A7A7A;pointer-events:none;
}
.search .clr{
  position:absolute;right:15px;top:50%;transform:translateY(-50%);
  color:#7A7A7A;display:none;padding:4px;
}
.search.filled .clr{display:block}
.search .clr:hover{color:#DDD}

/* ================= 分类条 ================= */
.cats{
  height:52px;display:flex;align-items:center;gap:8px;
  padding:0 32px;flex:none;position:relative;
}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding-right:120px}
.pills::-webkit-scrollbar{display:none}
.pill{
  height:33px;padding:0 15px;border-radius:999px;font-size:13.5px;
  color:#8A8A8A;display:flex;align-items:center;gap:7px;white-space:nowrap;
  flex:none;transition:.15s;user-select:none;
}
.pill:hover{color:#E4E4E4;background:#141414}
.pill.on{background:#fff;color:#0A0A0A;font-weight:600}
.pill .n{font-size:11px;opacity:.78}
.pill.on .n{opacity:.45}

.zoomwrap{
  position:absolute;right:32px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:9px;
  background:var(--bg);padding-left:22px;
}
.zoomwrap::before{
  content:"";position:absolute;left:0;top:-8px;bottom:-8px;width:22px;
  background:linear-gradient(to right,transparent,var(--bg) 60%);
}
.zoomwrap svg{color:#4E4E4E;flex:none}
input[type=range]{
  -webkit-appearance:none;width:80px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2E2E2E;border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;
  margin-top:-4.5px;transition:.14s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}

/* ================= 主区 ================= */
.main{
  height:calc(100vh - 130px);overflow-y:auto;padding:10px 32px 90px;
}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:#232323;border-radius:5px;border:3px solid var(--bg)}
.main::-webkit-scrollbar-thumb:hover{background:#333}

.count{font-size:12px;color:#5E5E5E;padding:2px 2px 14px;letter-spacing:.3px}

/* ---- 图墙 ---- */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));
  gap:20px;
}
.card{
  position:relative;aspect-ratio:4/3;background:var(--card);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.4,0,.2,1),box-shadow .22s;
  animation:cin .38s cubic-bezier(.2,.7,.3,1) backwards;
  animation-delay:calc(var(--i,0) * 8ms);
}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 20px 46px rgba(0,0,0,.55);
}
.thumb{position:absolute;inset:0;padding:6%;display:grid;place-items:center}
.thumb img{
  max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
  transition:transform .45s cubic-bezier(.2,.7,.3,1);
  opacity:0;
}
.thumb img.loaded{opacity:1;transition:opacity .3s,transform .45s cubic-bezier(.2,.7,.3,1)}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .ph{
  color:#C2C2C2;font-size:12px;text-align:center;line-height:1.8;
}

.info{
  position:absolute;left:0;right:0;bottom:0;background:#fff;color:#111;
  padding:11px 15px 14px;border-top:1px solid #EFEFEF;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  border-radius:0 0 14px 14px;
}
.card:hover .info{transform:none}
.info .n{
  font-size:13px;font-weight:600;line-height:1.4;color:#141414;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.info .m{display:flex;align-items:center;gap:8px;margin-top:5px}
.info .sku{
  font-family:Consolas,"Courier New",monospace;font-size:11px;color:#8C8C8C;
  background:#F4F4F4;border-radius:4px;padding:1px 6px;
}
.info .go{
  margin-left:auto;font-size:11.5px;color:#111;display:flex;align-items:center;gap:3px;
}
.info .go.no{color:#B5B5B5}

/* ---- 列表 ---- */
.list{display:block}
.lhead{
  display:flex;align-items:center;gap:14px;padding:0 14px 10px;font-size:11.5px;
  color:#4E4E4E;border-bottom:1px solid var(--line);margin-bottom:10px;
}
.lhead .h1{width:44px;flex:none}
.lhead .h2{flex:1}
.lhead .h3{width:80px;flex:none}
.lhead .h4{width:90px;flex:none;text-align:right}
.lhead .h5{width:40px;flex:none}
.row{
  display:flex;align-items:center;gap:14px;padding:8px 14px;background:#111;
  border:1px solid #1D1D1D;border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.14s;
}
.row:hover{background:#181818;border-color:#2E2E2E;transform:translateX(3px)}
.row .rt{width:44px;height:44px;border-radius:7px;object-fit:contain;background:#fff;flex:none;padding:3px}
.row .rn{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.row .rn .t{font-size:13px;font-weight:600;color:#E8E8E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn .s{font-size:11px;color:#5A5A5A;font-family:Consolas,monospace;flex:none}
.row .rc{width:80px;font-size:12px;color:#7A7A7A;flex:none}
.row .rl{width:90px;flex:none;font-size:12px;text-align:right}
.row .rl.ok{color:#5FBF8F}
.row .rl.no{color:#414141}
.row .go{opacity:0;transition:.14s;color:#fff;font-size:11.5px;flex:none;width:40px;text-align:right}
.row:hover .go{opacity:1}

/* ---- 加载 / 空状态 ---- */
.loading{text-align:center;padding:30px 0 10px;color:#4A4A4A;font-size:12px;display:none}
.loading.show{display:block}
.loading .spin{
  display:inline-block;width:13px;height:13px;border:1.5px solid #2A2A2A;border-top-color:#888;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px;
}
@keyframes sp{to{transform:rotate(360deg)}}
#sentinel{height:1px}
.empty{padding:120px 20px;text-align:center}
.empty h3{font-size:15px;color:#9A9A9A;font-weight:500;margin-bottom:10px}
.empty p{font-size:12.5px;color:#4E4E4E;line-height:1.9}

/* ---- Toast ---- */
.toast{
  position:fixed;left:50%;bottom:36px;transform:translate(-50%,16px);
  background:#fff;color:#111;padding:11px 22px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:.24s;z-index:200;max-width:70vw;
  box-shadow:0 10px 34px rgba(0,0,0,.6);font-weight:500;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="right">
    <div class="vt" id="vt">
      <button data-view="grid" class="on" title="图墙">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"></rect>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"></rect>
        </svg>
      </button>
      <button data-view="list" title="列表">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M4 6.5h16M4 12h16M4 17.5h16"></path>
        </svg>
      </button>
    </div>
    <div class="search" id="searchWrap">
      <svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
      </svg>
      <input id="q" type="text" placeholder="搜索" autocomplete="off" spellcheck="false">
      <button class="clr" id="clrBtn" title="清空">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="cats">
  <div class="pills" id="pills"></div>
  <div class="zoomwrap" id="zoomWrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="4" width="6" height="6" rx="1"></rect><rect x="3" y="14" width="6" height="6" rx="1"></rect>
      <path d="M13 7h8M13 17h8"></path>
    </svg>
    <input type="range" id="zoom" min="200" max="430" step="10" value="300">
  </div>
</nav>

<main class="main" id="scroller">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="loading" id="loading"><span class="spin"></span>加载中…</div>
  <div id="sentinel"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script src="data/items.js"></script>
<script>
"use strict";

const PAGE = 60;
const state = { all: [], view: [], rendered: 0, cat: "__all__", kw: "", mode: "grid", thumb: 300 };

const $ = id => document.getElementById(id);
const grid = $("grid"), scroller = $("scroller"), loadingEl = $("loading");
const emptyEl = $("empty"), countEl = $("count"), sentinel = $("sentinel");

/* ---------- 工具 ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const imgSrc = it => it.img ? "data/images/" + encodeURIComponent(it.img) : "";

/* ---------- 卡片 ---------- */
function cardHTML(it, idx) {
  const src = imgSrc(it);
  const hasLink = !!(it.url && it.url.trim());
  return `<article class="card" data-id="${esc(it.id)}" style="--i:${idx % 24}">
    <div class="thumb">
      ${src
        ? `<img src="${src}" alt="" loading="lazy" decoding="async" onload="this.classList.add('loaded')">`
        : `<div class="ph">暂无图片</div>`}
    </div>
    <div class="info">
      <div class="n">${esc(it.name || "未命名商品")}</div>
      <div class="m">
        <span class="sku">${esc(it.sku || it.id)}</span>
        <span class="go ${hasLink ? "" : "no"}">${hasLink ? "打开购买页 ↗" : "未填链接"}</span>
      </div>
    </div>
  </article>`;
}

function rowHTML(it) {
  const src = imgSrc(it);
  const hasLink = !!(it.url && it.url.trim());
  return `<div class="row" data-id="${esc(it.id)}">
    ${src ? `<img class="rt" src="${src}" alt="" loading="lazy">` : `<div class="rt"></div>`}
    <div class="rn">
      <span class="t">${esc(it.name || "未命名商品")}</span>
      <span class="s">${esc(it.sku || it.id)}</span>
    </div>
    <div class="rc">${esc(it.cat || "未分类")}</div>
    <div class="rl ${hasLink ? "ok" : "no"}">${hasLink ? "已关联" : "无链接"}</div>
    <div class="go">打开 ↗</div>
  </div>`;
}

const LIST_HEAD = `<div class="lhead">
  <div class="h1"></div><div class="h2">商品名称 / 货号</div>
  <div class="h3">分类</div><div class="h4">链接</div><div class="h5"></div>
</div>`;

/* ---------- 渲染 ---------- */
function renderMore() {
  if (state.rendered >= state.view.length) { loadingEl.classList.remove("show"); return; }
  loadingEl.classList.add("show");

  const start = state.rendered;
  const slice = state.view.slice(start, start + PAGE);
  const buf = document.createElement("div");
  buf.innerHTML = state.mode === "grid"
    ? slice.map((it, i) => cardHTML(it, i)).join("")
    : slice.map(rowHTML).join("");

  if (state.mode === "grid") {
    const frag = document.createDocumentFragment();
    while (buf.firstElementChild) frag.appendChild(buf.firstElementChild);
    grid.appendChild(frag);
  } else {
    let listEl = grid.querySelector(".list");
    if (!listEl) {
      listEl = document.createElement("div");
      listEl.className = "list";
      listEl.innerHTML = LIST_HEAD;
      grid.appendChild(listEl);
    }
    while (buf.firstElementChild) listEl.appendChild(buf.firstElementChild);
  }

  grid.style.display = state.mode === "grid" ? "grid" : "block";
  state.rendered += slice.length;
  loadingEl.classList.toggle("show", state.rendered < state.view.length);
  updateCount();
}

function resetRender() {
  grid.innerHTML = "";
  grid.style.display = state.mode === "grid" ? "grid" : "block";
  state.rendered = 0;
  const has = state.view.length > 0;
  emptyEl.style.display = has ? "none" : "block";
  if (!has) {
    emptyEl.innerHTML = `<h3>${state.kw ? "没有找到匹配的商品" : "图册还是空的"}</h3>
      <p>${state.kw ? "换个关键词试试" : "点右上角导入，把图片和表格放进来"}</p>`;
  }
  renderMore();
  updateCount();
}

function updateCount() {
  const t = state.view.length;
  countEl.textContent = state.kw
    ? `${t} 件匹配「${state.kw}」`
    : `共 ${t} 件商品`;
}

/* ---------- 过滤 ---------- */
function applyFilter() {
  const kw = state.kw.trim().toLowerCase();
  state.view = state.all.filter(it => {
    if (state.cat !== "__all__" && it.cat !== state.cat) return false;
    if (!kw) return true;
    return ((it.name || "") + " " + (it.sku || "") + " " + (it.note || "") + " " + (it.cat || "") + " " + (it.id || ""))
      .toLowerCase().includes(kw);
  });
  resetRender();
}

/* ---------- 分类胶囊 ---------- */
function renderPills() {
  const map = new Map();
  state.all.forEach(it => {
    const c = it.cat || "未分类";
    map.set(c, (map.get(c) || 0) + 1);
  });
  const arr = [...map.entries()].sort((a, b) => b[1] - a[1]);
  let html = `<div class="pill ${state.cat === "__all__" ? "on" : ""}" data-cat="__all__">
      全部<span class="n">${state.all.length}</span></div>`;
  html += arr.map(([c, n]) =>
    `<div class="pill ${state.cat === c ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></div>`
  ).join("");
  $("pills").innerHTML = html;
}

/* ---------- 交互 ---------- */
$("pills").addEventListener("click", e => {
  const el = e.target.closest(".pill");
  if (!el) return;
  state.cat = el.dataset.cat;
  renderPills();
  applyFilter();
  scroller.scrollTop = 0;
});

let kwTimer = null;
$("q").addEventListener("input", e => {
  const v = e.target.value;
  $("searchWrap").classList.toggle("filled", !!v);
  clearTimeout(kwTimer);
  kwTimer = setTimeout(() => {
    state.kw = v;
    applyFilter();
    scroller.scrollTop = 0;
  }, 130);
});

$("clrBtn").addEventListener("click", () => {
  $("q").value = "";
  $("searchWrap").classList.remove("filled");
  state.kw = "";
  applyFilter();
  $("q").focus();
});

$("vt").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  state.mode = b.dataset.view;
  [...$("vt").children].forEach(x => x.classList.toggle("on", x === b));
  $("zoomWrap").style.opacity = state.mode === "grid" ? "1" : ".25";
  $("zoomWrap").style.pointerEvents = state.mode === "grid" ? "auto" : "none";
  resetRender();
  scroller.scrollTop = 0;
});

$("zoom").addEventListener("input", e => {
  state.thumb = +e.target.value;
  document.documentElement.style.setProperty("--thumb", state.thumb + "px");
});

grid.addEventListener("click", e => {
  const el = e.target.closest("[data-id]");
  if (!el) return;
  const it = state.all.find(x => x.id === el.dataset.id);
  if (!it) return;
  if (it.url && it.url.trim()) {
    let u = it.url.trim();
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    window.open(u, "_blank", "noopener");
    toast("已打开 · " + (it.sku || it.id));
  } else {
    toast("这件还没填链接 —— 货号 " + (it.sku || it.id));
  }
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); $("q").focus(); $("q").select();
  }
  if (e.key === "Escape" && document.activeElement === $("q")) {
    $("q").value = ""; $("searchWrap").classList.remove("filled");
    state.kw = ""; applyFilter(); $("q").blur();
  }
});

const io = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) renderMore();
}, { root: scroller, rootMargin: "700px" });
io.observe(sentinel);

/* ---------- 启动 ---------- */
async function boot() {
  if (Array.isArray(window.__DATA__)) {
    state.all = window.__DATA__;
  } else {
    try {
      const res = await fetch("data/items.json", { cache: "no-store" });
      state.all = await res.json();
    } catch (err) { state.all = []; toast("数据加载失败"); }
  }
  renderPills();
  applyFilter();
  window.__ready = true;
}
boot();
</script>
</body>
</html>
